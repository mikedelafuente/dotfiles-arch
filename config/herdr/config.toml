# Herdr configuration
# https://herdr.dev/docs/configuration/

onboarding = false

[theme]
name = "catppuccin"

[terminal]
default_shell = "bash"
shell_mode = "auto"
new_cwd = "follow"

[session]
resume_agents_on_restore = true

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[keys]
prefix = "ctrl+b"

[ui]
agent_panel_sort = "spaces"
