<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Shared font preferences for this workstation.
     Linked to ~/.config/fontconfig/fonts.conf by link-dotfiles.sh -->
<fontconfig>
  <!-- Prefer GNOME Adwaita + Noto/Liberation for UI text -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Noto Sans</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Liberation Serif</family>
    </prefer>
  </alias>

  <!-- Match Kitty / Neovim stack for system monospace -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Adwaita Mono</family>
      <family>Noto Sans Mono</family>
      <family>Liberation Mono</family>
    </prefer>
  </alias>

  <!-- Map stale GNOME defaults so old gsettings still look correct -->
  <alias>
    <family>Cantarell</family>
    <prefer>
      <family>Adwaita Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>Source Code Pro</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Adwaita Mono</family>
    </prefer>
  </alias>
</fontconfig>
